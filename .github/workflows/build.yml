name: Build MyCAD on Windows

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Set up Qt path
        run: |
          # Устанавливаем переменные окружения для Qt
          $env:QT_PATH = "C:\Qt\6.8.0\msvc2022_64"
          $env:CMAKE_PREFIX_PATH = "$env:QT_PATH\lib\cmake\Qt6;$env:CMAKE_PREFIX_PATH"

      - name: Configure CMake
        run: |
          cmake -G "Visual Studio 17 2022" -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="$env:CMAKE_PREFIX_PATH" -B ${{ github.workspace }}/build -S ${{ github.workspace }}/MyCAD

      - name: Build
        run: cmake --build ${{ github.workspace }}/build --config Release
