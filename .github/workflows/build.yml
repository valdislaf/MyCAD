name: Build MyCAD on Windows

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Qt
        uses: jurplel/install-qt-action@v3
        with:
          version: '6.8.0'
          arch: 'win64_msvc2019_64'

      - name: Install CMake
        run: choco install cmake

      - name: Install Visual Studio Build Tools
        run: choco install visualstudio2019buildtools

      - name: Set Qt6_DIR environment variable
        run: echo "Qt6_DIR=C:/Qt/6.8.0/msvc2019_64/lib/cmake/Qt6" >> $GITHUB_ENV

      - name: Configure CMake
        run: cmake -G "Visual Studio 17 2022" -DCMAKE_BUILD_TYPE=Release -B build

      - name: Build
        run: cmake --build build --config Release
