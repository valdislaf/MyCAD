name: Build MyCAD on Windows

on:
  push:
    tags:
      - "v*"  # Запускать только при пуше тегов вида v1.0.0

permissions:
  contents: write  # Даем доступ к созданию релиза  и "Workflow permissions" -> Read and write permissions 

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Install latest aqtinstall
        run: python -m pip install --upgrade aqtinstall

      - name: Check available Qt versions
        run: aqt list-qt windows desktop  # Вывод всех версий

      - name: Check available Qt modules
        run: aqt list-qt windows desktop --modules 6.8.0 win64_msvc2022_64  # Проверка модулей

      - name: Install Qt 6.8.0
        uses: jurplel/install-qt-action@v3
        with:
          version: '6.8.0'
          target: 'desktop'
          arch: 'win64_msvc2022_64'
          cache: true

      - name: Configure CMake
        run: |
          cmake -G "Visual Studio 17 2022" -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="%Qt6_DIR%" -B ${{ github.workspace }}/build -S ${{ github.workspace }}/MyCAD

      - name: Build
        run: cmake --build ${{ github.workspace }}/build --config Release

      - name: Create xtest file (для отладки)
        run: echo "Test file content" > ${{ github.workspace }}/xtest

      - name: Create Release
        id: create_release
        uses: softprops/action-gh-release@v1  # Используем актуальный экшен
        with:
          tag_name: ${{ github.ref_name }}
          release_name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v1
        with:
          files: ${{ github.workspace }}/xtest  # Загружаем файл
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          
