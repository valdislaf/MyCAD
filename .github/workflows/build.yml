name: Build MyCAD

on:
  push:
    branches:
      - master
    tags:
      - "v*"  # Запуск при пуше тега

  pull_request:
    branches:
      - master

permissions:
  contents: write  # Даем доступ к созданию релиза и "Workflow permissions" -> Read and write permissions.

jobs:
  # Сборка для Windows (Release)
  win:
    runs-on: windows-latest

    steps:
      # Ваши шаги для сборки Windows
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'
      - name: Install latest aqtinstall
        run: python -m pip install --upgrade aqtinstall
      - name: Install Qt 6.8.0
        uses: jurplel/install-qt-action@v3
        with:
          version: '6.8.0'
          target: 'desktop'
          arch: 'win64_msvc2022_64'
          cache: true
      - name: Configure CMake (Release)
        run: cmake -G "Visual Studio 17 2022" -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="%Qt6_DIR%" -B ${{ github.workspace }}/build -S ${{ github.workspace }}/MyCAD
      - name: Build (Release)
        run: cmake --build ${{ github.workspace }}/build --config Release
      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        id: create_release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Upload Release Asset
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: D:/a/MyCAD/MyCAD/build/Release/MyCAD.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Сборка для Windows (Debug)
  win_debug:
    runs-on: windows-latest

    steps:
      # Ваши шаги для сборки Windows Debug
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'
      - name: Install latest aqtinstall
        run: python -m pip install --upgrade aqtinstall
      - name: Install Qt 6.8.0
        uses: jurplel/install-qt-action@v3
        with:
          version: '6.8.0'
          target: 'desktop'
          arch: 'win64_msvc2022_64'
          cache: true
      - name: Configure CMake (Debug)
        run: cmake -G "Visual Studio 17 2022" -DCMAKE_BUILD_TYPE=Debug -DCMAKE_PREFIX_PATH="%Qt6_DIR%" -B ${{ github.workspace }}/build -S ${{ github.workspace }}/MyCAD
      - name: Build (Debug)
        run: cmake --build ${{ github.workspace }}/build --config Debug
      - name: Create Debug 
        if: startsWith(github.ref, 'refs/tags/')
        id: create_debug
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.ref_name }}-debug
          name: Debug ${{ github.ref_name }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Rename Debug Executables
        run: |
          move D:/a/MyCAD/MyCAD/build/Debug/MyCAD.exe D:/a/MyCAD/MyCAD/build/Debug/MyCAD_d.exe
      - name: Upload Debug Asset
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.ref_name }}-debug
          files: D:/a/MyCAD/MyCAD/build/Debug/MyCAD_d.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Сборка для Ubuntu (Release)
  ubuntu:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'
      - name: Install Qt6
        run: |
          sudo apt-get update
          sudo apt-get install qt6-base-dev
      - name: Configure CMake (Release)
        run: |
          cmake -G "Unix Makefiles" -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="/opt/qt6/lib/cmake/Qt6" -B ${{ github.workspace }}/build -S ${{ github.workspace }}/MyCAD
      - name: Build (Release)
        run: cmake --build ${{ github.workspace }}/build --config Release
      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        id: create_release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Upload Release Asset
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files:  ${{ github.workspace }}/build/MyCAD
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Сборка для Ubuntu (Debug)
  ubuntu_debug:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'
      - name: Install Qt6
        run: |
          sudo apt-get update
          sudo apt-get install qt6-base-dev
      - name: Configure CMake (Debug)
        run: |
          cmake -G "Unix Makefiles" -DCMAKE_BUILD_TYPE=Debug -DCMAKE_PREFIX_PATH="/opt/qt6/lib/cmake/Qt6" -B ${{ github.workspace }}/build -S ${{ github.workspace }}/MyCAD
      - name: Build (Debug)
        run: cmake --build ${{ github.workspace }}/build --config Debug
      - name: Create Debug
        if: startsWith(github.ref, 'refs/tags/')
        id: create_debug
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.ref_name }}-debug
          name: Debug ${{ github.ref_name }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Rename Debug Executables
        run: |
           mv ${{ github.workspace }}/build/MyCAD ${{ github.workspace }}/build/MyCAD_d
      - name: Upload Debug Asset
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.ref_name }}-debug
          files:  ${{ github.workspace }}/build/MyCAD_d
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

