name: Build MyCAD on Windows

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'  # Убедитесь, что версия Python указана, если нужно

      - name: Download Qt 6.8.0
        run: |
          Invoke-WebRequest -Uri "https://download.qt.io/official_releases/qt/6.8/6.8.0/qt-opensource-windows-x86_64-6.8.0.exe" -OutFile "qt-installer.exe"
          Start-Process -FilePath "qt-installer.exe" -ArgumentList "/S" -Wait

      - name: Configure CMake
        run: |
          cmake -G "Visual Studio 17 2022" -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="$(conda info --base)/envs/your-env-name" -B ${{ github.workspace }}/build -S ${{ github.workspace }}/MyCAD

      - name: Build
        run: cmake --build ${{ github.workspace }}/build --config Release
