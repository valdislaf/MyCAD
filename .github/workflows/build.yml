name: Build MyCAD on Windows

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  build:
    runs-on: windows-latest

    steps:
        
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Install Qt 6
        uses: jurplel/install-qt-action@v3
        with:
          version: '6.8.0'
          target: 'desktop'
          arch: 'win64_msvc2019_64' # Или 'win64_msvc2022_64', если используешь MSVC 2022
          cache: true

      - name: Configure CMake
        run: |
          cmake -G "Visual Studio 17 2022" -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="%Qt6_DIR%" -B ${{ github.workspace }}/build -S ${{ github.workspace }}/MyCAD

      - name: Build
        run: cmake --build ${{ github.workspace }}/build --config Release