name: Build MyCAD on Windows

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.13.2'

      - name: Install aqt
        run: |
          python -m pip install --upgrade pip
          pip install aqt
          # Проверим, что aqt установлен и доступен в PATH
          aqt --version

      - name: Install Qt
        run: |
          # Убедитесь, что путь к Scripts добавлен в PATH
          $env:PATH += ";C:\hostedtoolcache\windows\Python\3.11.2\x64\Scripts"
          # Проверим доступность aqt через команду
          aqt --version
          # Установим Qt
          aqt install-qt windows desktop 6.8.0 win64_msvc2022_64

      - name: Configure CMake
        run: cmake -G "Visual Studio 17 2022" -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="$env:Qt6_DIR" -B ${{ github.workspace }}/build -S ${{ github.workspace }}/MyCAD

      - name: Build
        run: cmake --build ${{ github.workspace }}/build --config Release
